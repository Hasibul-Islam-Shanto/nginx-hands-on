events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # ==========================================
        # GZIP CONFIGURATION
        # ==========================================
        gzip on;
        
        # Compression level (1 = fastest/least, 9 = slowest/best, 5-6 is sweet spot)
        gzip_comp_level 6;

        # Don't compress files smaller than 1KB (header overhead makes them larger)
        gzip_min_length 1024;

        # Tell downstream CDNs / caches to store both compressed & uncompressed copies
        gzip_vary on;

        # Compress responses from upstream reverse-proxied backends too
        gzip_proxied any;

        # Only compress text-based formats (NEVER compress jpg, png, or mp4)
        gzip_types
            text/plain
            text/css
            application/json
            application/javascript
            text/xml
            application/xml
            image/svg+xml;
    }
}

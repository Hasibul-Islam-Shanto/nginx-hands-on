version: "3.8"

services:
  backend:
    build: ./backend
    container_name: caching-backend
    restart: always
    environment:
      - PORT=5001
    networks:
      - cache-net

  nginx:
    image: nginx:alpine
    container_name: caching-nginx
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
      - nginx_cache_data:/var/cache/nginx
    depends_on:
      - backend
    networks:
      - cache-net

networks:
  cache-net:
    driver: bridge

volumes:
  nginx_cache_data:


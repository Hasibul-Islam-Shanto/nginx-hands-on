# NGINX Configuration for Fullstack App (Running locally without Docker)
# Route /     -> React Frontend (Vite dev server on :5173 or static dist)
# Route /api/ -> Node.js Express API on :5001

upstream backend_service {
    server 127.0.0.1:5001;
    keepalive 32;
}

upstream frontend_service {
    server 127.0.0.1:5173;
    keepalive 32;
}

server {
    listen 80;
    server_name localhost;

    # Access and Error logs (optional - adjust paths as needed)
    # access_log /var/log/nginx/fullstack-access.log;
    # error_log  /var/log/nginx/fullstack-error.log;

    # --------------------------------------------------------------------------
    # 1. API Endpoints -> Node.js Express Backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # --------------------------------------------------------------------------
    # 2. Frontend -> React Vite Dev Server (Default for local development)
    # Includes WebSocket upgrade for Vite HMR (Hot Module Replacement)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Vite HMR WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # Alternative: Serve Production Build directly from disk (after 'npm run build')
    # If you prefer NGINX to serve static files instead of proxying Vite, 
    # comment out the 'location /' block above and uncomment the block below:
    # --------------------------------------------------------------------------
    # root /home/ubuntu/nginx-hands-on/reverse-proxy/fullstack-app/frontend/dist;
    # index index.html;
    #
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
}

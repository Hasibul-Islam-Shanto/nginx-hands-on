events {}

http {
  log_format upstream_log '$remote_addr - [$time_local] '
                          '"$request" $status '
                          'upstream=$upstream_addr '
                          'upstream_status=$upstream_status';

  # =========================================================================
  # LOAD BALANCER CONFIGURATION
  # Choose an algorithm by uncommenting ONE of the configurations below:
  # =========================================================================

  # --- 1. Round Robin (Default) ---
  upstream app1 {
    server server1:3001;
    server server2:3001;
    server server3:3001;
  }

  # --- 2. Weighted Round Robin (Server 1 gets 3x more traffic) ---
  # upstream app1 {
  #   server server1:3001 weight=3;
  #   server server2:3001 weight=1;
  #   server server3:3001 weight=1;
  # }

  # --- 3. Least Connections (Route to server with least active connections) ---
  # upstream app1 {
  #   least_conn;
  #   server server1:3001;
  #   server server2:3001;
  #   server server3:3001;
  # }

  # --- 4. IP Hash (Sticky session based on client IP) ---
  # upstream app1 {
  #   ip_hash;
  #   server server1:3001;
  #   server server2:3001;
  #   server server3:3001;
  # }

  # --- 5. Failover / Backup (server3 only used when 1 & 2 are down) ---
  # upstream app1 {
  #   server server1:3001;
  #   server server2:3001;
  #   server server3:3001 backup;
  # }

  server {
    listen 80;
    access_log /var/log/nginx/access.log upstream_log;

    # Matches /app1/ for load-test.sh
    location /app1/ {
      proxy_pass http://app1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root fallback
    location / {
      proxy_pass http://app1/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}

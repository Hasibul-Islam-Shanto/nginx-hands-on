version: "3.8"

services:
  app1:
    build: ./server1
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
    networks:
      - webnet

networks:
  webnet:
    driver: bridge

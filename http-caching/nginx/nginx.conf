events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format that includes cache status and response time
    log_format cache_log '$remote_addr - [$time_local] '
                         '"$request" $status '
                         'cache=$upstream_cache_status '
                         'upstream_time=$upstream_response_time '
                         'total_time=$request_time';

    # =========================================================================
    # 1. SERVER-SIDE REVERSE PROXY CACHE DEFINITION
    # =========================================================================
    # - levels=1:2 creates a subfolder structure (avoids directory file limits)
    # - keys_zone=API_CACHE:10m allocates 10MB in RAM (~80,000 keys)
    # - max_size=250m sets maximum disk space allocated for cached responses
    # - inactive=10m removes items not requested for 10 minutes
    # - use_temp_path=off writes directly to cache directory without extra copy
    # =========================================================================
    proxy_cache_path /var/cache/nginx/api_cache
        levels=1:2
        keys_zone=API_CACHE:10m
        max_size=250m
        inactive=10m
        use_temp_path=off;

    # Gzip compression for faster asset delivery
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    server {
        listen 80;
        server_name localhost;
        access_log /var/log/nginx/access.log cache_log;

        root /usr/share/nginx/html;
        index index.html;

        # =====================================================================
        # 2. SERVER-SIDE API CACHING
        # =====================================================================
        location /api/ {
            proxy_pass http://backend:5001;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Enable the API_CACHE zone
            proxy_cache API_CACHE;

            # The unique key for each cached item
            proxy_cache_key "$request_method$request_uri";

            # Cache successful 200 responses for 15 seconds (for lab testing)
            proxy_cache_valid 200 15s;
            proxy_cache_valid 404 5s;

            # High availability: serve stale cache if backend is down or updating
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

            # Bypass cache when client sends header: "Cache-Bypass: 1"
            proxy_cache_bypass $http_cache_bypass;

            # Expose cache status (HIT, MISS, BYPASS, EXPIRED) to the client
            add_header X-Cache-Status $upstream_cache_status always;
            add_header X-Cache-Key "$request_method $request_uri" always;
        }

        # Do not cache stats endpoint so live counters are always fresh
        location /api/stats {
            proxy_pass http://backend:5001;
            proxy_cache off;
            add_header X-Cache-Status "BYPASS_EXPLICIT" always;
        }

        # =====================================================================
        # 3. CLIENT / BROWSER CACHING FOR STATIC ASSETS (CSS, JS, Images, SVG)
        # =====================================================================
        location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header X-Asset-Cache "BROWSER_CACHE_ACTIVE" always;
        }

        # =====================================================================
        # 4. FRONTEND HTML SPA ROUTING (Never cache index.html in browser)
        # =====================================================================
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }
    }
}


version: "3.8"

services:
  server1:
    build: ./server1
    environment:
      - PORT=3001
      - SERVER_NAME=server1
    networks:
      - webnet

  server2:
    build: ./server1
    environment:
      - PORT=3001
      - SERVER_NAME=server2
    networks:
      - webnet

  server3:
    build: ./server1
    environment:
      - PORT=3001
      - SERVER_NAME=server3
    networks:
      - webnet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3
    networks:
      - webnet

networks:
  webnet:
    driver: bridge
